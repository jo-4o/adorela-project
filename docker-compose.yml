services:
  # ==================== BANCO DE DADOS ====================
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: adorela-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adorela}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "5433:5432"
    command: ["-c", "ssl=on", "-c", "ssl_cert_file=/var/lib/postgresql/certs/postgres-server.crt", "-c", "ssl_key_file=/var/lib/postgresql/certs/postgres-server.key"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./certs:/var/lib/postgresql/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== KEYCLOAK ====================
  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    container_name: adorela-keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-adorela}
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-adorela.json:/opt/keycloak/data/import/realm-adorela.json:ro,Z
    depends_on:
      postgres:
        condition: service_healthy

  # ==================== BACKEND API ====================
  api:
    image: adorela-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: adorela-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-adorela}?sslmode=require
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:-http://localhost:8080/realms/adorela}
      ADORELA_CORS_ALLOWED_ORIGINS: ${ADORELA_CORS_ALLOWED_ORIGINS:-https://localhost,https://localhost:4200,https://sistema2.net}
      ADORELA_UPLOAD_DIR: /app/uploads
      # TLS / HTTPS habilitado por padrão em 8443
      SERVER_PORT: ${SERVER_PORT:-8443}
      SERVER_SSL_ENABLED: ${SERVER_SSL_ENABLED:-true}
      SERVER_SSL_KEY_STORE: ${SERVER_SSL_KEY_STORE:-file:/app/certs/api-keystore.p12}
      SERVER_SSL_KEY_STORE_PASSWORD: ${SERVER_SSL_KEY_STORE_PASSWORD:-adorela123}
      SERVER_SSL_KEY_ALIAS: ${SERVER_SSL_KEY_ALIAS:-adorela-api}
    ports:
      - "8443:8443"
    volumes:
      - uploads_data:/app/uploads:Z
      - ./certs:/app/certs:ro,Z
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  # ==================== FRONTEND WEB ====================
  web:
    image: adorela-web:latest
    build:
      context: ./adorela-web
      dockerfile: Dockerfile
    container_name: adorela-web
    environment:
      API_HOST: api
      API_PORT: "8080"
      API_URL: ""
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: adorela
      KEYCLOAK_CLIENT_ID: adorela-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs/api-cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./certs/api-key.pem:/etc/nginx/certs/key.pem:ro
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  keycloak_data:
  uploads_data:
