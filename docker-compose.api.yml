# =====================================================================
# VM 2 - Backend API (Spring Boot)
# Execute: docker compose -f docker-compose.api.yml --env-file .env up -d
#
# Antes de rodar, faça o build da imagem:
#   docker build -t adorela-api:latest .
# =====================================================================
services:
  api:
    image: adorela-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adorela-api
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://localhost:5432/adorela}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-123456}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:-http://localhost:8080/realms/adorela}
      ADORELA_CORS_ALLOWED_ORIGINS: ${ADORELA_CORS_ALLOWED_ORIGINS:-https://localhost,https://sistema2.net}
      ADORELA_UPLOAD_DIR: /app/uploads
      # TLS / HTTPS habilitado por padrão em 8443
      SERVER_PORT: ${SERVER_PORT:-8443}
      SERVER_SSL_ENABLED: ${SERVER_SSL_ENABLED:-true}
      SERVER_SSL_KEY_STORE: ${SERVER_SSL_KEY_STORE:-file:/app/certs/api-keystore.p12}
      SERVER_SSL_KEY_STORE_PASSWORD: ${SERVER_SSL_KEY_STORE_PASSWORD:-adorela123}
      SERVER_SSL_KEY_ALIAS: ${SERVER_SSL_KEY_ALIAS:-adorela-api}
    ports:
      - "8443:8443"
    volumes:
      - uploads_data:/app/uploads
      - ./certs:/app/certs:ro

volumes:
  uploads_data:
